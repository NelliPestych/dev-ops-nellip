apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    app: django
    release: {{ .Release.Name }}
type: Opaque
data:
  {{- if .Values.secrets.SECRET_KEY }}
  SECRET_KEY: {{ .Values.secrets.SECRET_KEY | b64enc }}
  {{- end }}
  {{- if .Values.secrets.DB_PASSWORD }}
  DB_PASSWORD: {{ .Values.secrets.DB_PASSWORD | b64enc }}
  {{- end }}

