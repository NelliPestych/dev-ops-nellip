replicaCount: 2

image:
  repository: "053414411835.dkr.ecr.us-west-2.amazonaws.com/lesson-8-9-django-ecr"
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80
  targetPort: 8000

# Non-sensitive configuration (stored in ConfigMap)
config:
  DJANGO_SETTINGS_MODULE: "config.settings"
  DEBUG: "0"
  ALLOWED_HOSTS: "*"
  # Database configuration from lesson-4
  DB_HOST: "db"
  DB_NAME: "postgres"
  DB_USER: "postgres"
  DB_PORT: "5432"

# Sensitive data (stored in Kubernetes Secret)
# ⚠️ ВАЖНО: Для production используйте внешние системы управления секретами:
# - AWS Secrets Manager (рекомендуется для EKS)
# - HashiCorp Vault
# - Sealed Secrets (для GitOps)
# - External Secrets Operator
# 
# См. SECURITY.md для детальных инструкций
secrets:
  # Django secret key from lesson-4
  # В production должен быть длинным случайным ключом
  SECRET_KEY: "django-insecure-jzx!h5%ofjiz63h5ho7c@r4lk*z9$+53%0b2d_b&mdu9*gw6&@"
  # Database password
  # В production должен быть сложным паролем
  DB_PASSWORD: "postgres"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
