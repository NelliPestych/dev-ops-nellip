version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: djangodb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ChangeMe123!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn --bind 0.0.0.0:8000 --workers 4 app.wsgi:application"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_NAME=djangodb
      - DATABASE_USER=admin
      - DATABASE_PASSWORD=ChangeMe123!
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
